services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser UI: http://localhost:7474
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/cinegraph-pass
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + dashboard: http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
