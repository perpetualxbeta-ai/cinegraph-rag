[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinegraph-rag"
version = "0.1.0"
description = "Hybrid RAG: Neo4j knowledge graph + Qdrant vector search, fused into one retriever"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "neo4j>=5.0",
  "qdrant-client>=1.10",
  "anthropic>=0.40",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
cinegraph = "cinegraph.cli:main"

[tool.setuptools]
packages = ["cinegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
